# 宝塔面板容器编排：只构建并运行 Sub2API，PostgreSQL 和 Redis 使用宿主机服务。
# 请通过数据库/Redis环境变量填写宿主机上对 Docker 容器可达的连接地址。

services:
  sub2api:
    image: scarecorw/sub2api:cloud
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: sub2api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BIND_HOST:-0.0.0.0}:${SERVER_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: ${SERVER_MODE:-release}
      TZ: ${TZ:-Asia/Shanghai}

      DATABASE_HOST: ${DATABASE_HOST:-host.docker.internal}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USER: ${DATABASE_USER:-sub2api}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?请设置 DATABASE_PASSWORD}
      DATABASE_DBNAME: ${DATABASE_DBNAME:-sub2api}
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-disable}

      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_ENABLE_TLS: ${REDIS_ENABLE_TLS:-false}

      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - sub2api_data:/app/data

volumes:
  sub2api_data:
